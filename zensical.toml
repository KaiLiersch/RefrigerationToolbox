[project]
site_name = "RefrigerationToolbox"
site_url = "https://KaiLiersch.github.io/RefrigerationToolbox/"
repo_url = "https://github.com/KaiLiersch/RefrigerationToolbox"
repo_name = "KaiLiersch/RefrigerationToolbox"

nav = [
  { "Home" = "index.md" },
  { "Installation" = "installation.md" },
  { "Usage" = [
    { "Overview" = "usage.md" },
    { "Example 01 - Simple refrigeration cycle" = "examples/example01.md" },
    { "Example 02 - Polynomial compressors & plate heat exchangers" = "examples/example02.md" },
    { "Example 03 - Plotting" = "examples/example03.md" },
  ] },
  { "API Reference" = "api.md" },
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to light mode"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
show_root_heading = true
show_root_full_path = false
show_source = true
members_order = "source"
separate_signature = true
show_signature_annotations = true
merge_init_into_class = true
docstring_section_style = "table"
